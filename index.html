 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One-Tap Wallet Transfer</title>
  
  <!-- Web3 Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #ffffff;
      --subtext: #94a3b8;
      --border: #2d3748;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    h2 { margin-top: 0; font-size: 1.4rem; text-align: center; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 0.85rem; color: var(--subtext); }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0d121f;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    select:focus, input:focus { outline: 1px solid var(--accent); }
    button.send-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button.send-btn:hover { background: var(--accent-hover); }
    .wallet-apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .app-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: background 0.2s;
    }
    .app-btn:hover { background: #334155; }
    #status {
      margin-top: 15px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.2em;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ One-Tap Transfer</h2>

  <!-- Network Selection -->
  <label for="networkSelect">Select Blockchain Network:</label>
  <select id="networkSelect" onchange="updateReceivingWallet()">
    <option value="ethereum">Ethereum (ETH)</option>
    <option value="bnb">BNB Smart Chain (BNB)</option>
    <option value="polygon">Polygon (POL / MATIC)</option>
    <option value="arbitrum">Arbitrum (ETH)</option>
    <option value="optimism">Optimism (ETH)</option>
    <option value="base">Base (ETH)</option>
    <option value="solana">Solana (SOL)</option>
  </select>

  <!-- Auto-Filled Receiving Address -->
  <label for="receiverInput">Target Receiving Address:</label>
  <input type="text" id="receiverInput" readonly disabled />

  <!-- Amount Entry -->
  <label for="amountInput">Amount to Transfer:</label>
  <input type="number" id="amountInput" placeholder="0.1" step="any" min="0.000001" />

  <!-- Direct Transfer Trigger -->
  <button class="send-btn" onclick="executeTransfer()">Transfer in 1-Tap</button>

  <p id="status"></p>

  <hr style="border: 0; border-top: 1px solid var(--border); margin: 25px 0 15px 0;" />

  <!-- Master Launchers for Mobile Apps -->
  <label style="text-align: center; font-weight: bold;">Launch Mobile Wallet Apps Directly:</label>
  <div class="wallet-apps-grid">
    <a href="#" onclick="openWalletApp('phantom')" class="app-btn">👻 Phantom</a>
    <a href="#" onclick="openWalletApp('metamask')" class="app-btn">🦊 MetaMask</a>
    <a href="#" onclick="openWalletApp('trust')" class="app-btn">🛡️ Trust Wallet</a>
    <a href="#" onclick="openWalletApp('coinbase')" class="app-btn">🔵 Coinbase Wallet</a>
  </div>
</div>

<script>
  // =========================================================
  // 1. CONFIGURATION: CONFIGURE YOUR RECEIVING WALLETS HERE
  // =========================================================
  
  // All EVM chains (Ethereum, BNB Chain, Polygon, Arbitrum, Base, Optimism)
  // use the exact same receiving format (0x...)
  const Ethereum_Receive = "My_wallet"; 
  const BNB_Receive = Ethereum_Receive; // Standard EVM shared address
  
  // Non-EVM chains require their own specific formats:
  const Solana_Receive = "My_wallet"; 

  // Object mapping each dropdown network to its designated receiving address
  const WALLET_MAP = {
    ethereum: Ethereum_Receive,
    bnb: BNB_Receive,
    polygon: Ethereum_Receive,
    arbitrum: Ethereum_Receive,
    optimism: Ethereum_Receive,
    base: Ethereum_Receive,
    solana: Solana_Receive
  };

  // Set default state on load
  function updateReceivingWallet() {
    const selectedNetwork = document.getElementById("networkSelect").value;
    document.getElementById("receiverInput").value = WALLET_MAP[selectedNetwork] || "My_wallet";
  }
  window.onload = updateReceivingWallet;

  // =========================================================
  // 2. MASTER DEEP-LINK APPS OPENER
  // =========================================================
  function openWalletApp(walletType) {
    // Current web URL to open inside the mobile wallet browser
    const currentUrl = encodeURIComponent(window.location.href);

    let deepLink = "";
    switch(walletType) {
      case 'phantom':
        deepLink = `https://phantom.app/ul/browse/${currentUrl}`;
        break;
      case 'metamask':
        deepLink = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}`;
        break;
      case 'trust':
        deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${currentUrl}`;
        break;
      case 'coinbase':
        deepLink = `https://go.cb-w.com/dapp?cb_url=${currentUrl}`;
        break;
    }

    if (deepLink) {
      window.location.href = deepLink;
    }
  }

  // =========================================================
  // 3. ONE-TAP TRANSFER LOGIC
  // =========================================================
  async function executeTransfer() {
    const network = document.getElementById("networkSelect").value;
    const receiver = WALLET_MAP[network];
    const amountVal = document.getElementById("amountInput").value;
    const status = document.getElementById("status");

    if (!amountVal || parseFloat(amountVal) <= 0) {
      status.innerText = "Please enter a valid amount.";
      status.style.color = "#f87171";
      return;
    }

    status.style.color = "#38bdf8";

    // --- SOLANA EXECUTION ---
    if (network === "solana") {
      const provider = window.solana;
      if (!provider || !provider.isPhantom) {
        alert("Solana wallet not found. Use the Phantom launcher below to open this page inside your wallet.");
        return;
      }
      try {
        status.innerText = "Connecting Phantom...";
        await provider.connect();

        status.innerText = "Building Solana Transaction...";
        const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl("mainnet-beta"));
        const fromPubKey = provider.publicKey;
        const toPubKey = new solanaWeb3.PublicKey(receiver);
        const lamports = Math.floor(parseFloat(amountVal) * solanaWeb3.LAMPORTS_PER_SOL);

        const transaction = new solanaWeb3.Transaction().add(
          solanaWeb3.SystemProgram.transfer({
            fromPubkey: fromPubKey,
            toPubkey: toPubKey,
            lamports: lamports,
          })
        );

        transaction.feePayer = fromPubKey;
        const { blockhash } = await connection.getLatestBlockhash();
        transaction.recentBlockhash = blockhash;

        status.innerText = "Awaiting wallet approval...";
        const { signature } = await provider.signAndSendTransaction(transaction);
        status.innerText = `✅ Transfer Sent! Tx: ${signature.slice(0, 8)}...`;
        status.style.color = "#4ade80";
      } catch (err) {
        console.error(err);
        status.innerText = "❌ Transaction cancelled or failed.";
        status.style.color = "#f87171";
      }
      return;
    }

    // --- EVM EXECUTION (Ethereum, BNB Chain, Polygon, Arbitrum, Base, etc.) ---
    if (!window.ethereum) {
      alert("No EVM provider detected. Tap one of the mobile app buttons below to open this page inside your wallet app.");
      return;
    }

    try {
      status.innerText = "Connecting EVM Wallet...";
      const provider = new ethers.BrowserProvider(window.ethereum);
      
      // Request wallet accounts
      await provider.send("eth_requestAccounts", []);
      const signer = await provider.getSigner();

      status.innerText = "Awaiting wallet approval...";
      const tx = await signer.sendTransaction({
        to: receiver,
        value: ethers.parseEther(amountVal)
      });

      status.innerText = `✅ Transfer Submitted! Hash: ${tx.hash.slice(0, 10)}...`;
      status.style.color = "#4ade80";
    } catch (err) {
      console.error(err);
      status.innerText = "❌ Transfer cancelled or failed.";
      status.style.color = "#f87171";
    }
  }
</script>

</body>
</html>
